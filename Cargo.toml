[package]
name = "offerings"
version = "0.1.0"
edition = "2021"
description = "A unified package manager GUI for Linux"
authors = ["Offerings Team"]
license = "MIT"

[dependencies]
# UI Framework
slint = "=1.0.0"

# Async Runtime
tokio = { version = "1.35", features = ["full", "process"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Async traits
async-trait = "0.1"

# Database
rusqlite = { version = "0.30", features = ["bundled"] }

# Desktop notifications
notify-rust = "4.10"

# HTTP client for GitHub adapter
reqwest = { version = "0.11", features = ["json", "rustls-tls"], default-features = false }

# Standard directories
dirs = "5.0"

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# Unix-specific features
libc = "0.2"

[build-dependencies]
slint-build = "=1.0.0"

[[bin]]
name = "offerings"
path = "src/main.rs"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true

[profile.dev]
opt-level = 1
