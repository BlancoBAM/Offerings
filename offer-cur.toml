# Lilith Curated Apps
#
# Each entry represents an app hand-picked for the Lilith Linux experience.
# Source is determined by the URL pattern (Flathub → flatpak, Snapcraft → snap,
# GitHub → github, direct AppImage links → appimage).
#
# Categories are assigned based on app function and used for sidebar organization.
# Every entry implicitly belongs to the "Lilith" curated section.

