name: Build and Release

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: stable
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Build and test
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            pkg-config \
            libfontconfig1-dev \
            libfreetype6-dev \
            libexpat1-dev
      
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Check formatting
        run: cargo fmt --all -- --check
      
      - name: Run Clippy
        run: cargo clippy -- -W clippy::all
      
      - name: Build
        run: cargo build --release
      
      - name: Run tests
        run: cargo test --release
      
      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: offerings-binary
          path: target/release/offerings
          retention-days: 7

  # Build AppImage, DEB, and RPM
  package:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
      
      - name: Install packaging tools
        run: |
          cargo install cargo-deb
          cargo install cargo-generate-rpm
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            pkg-config \
            fuse \
            libfuse2 \
            libfontconfig1-dev \
            libfreetype6-dev \
            libexpat1-dev \
            rpm
      
      - name: Build release
        run: cargo build --release
      
      - name: Build AppImage
        run: |
          chmod +x build-appimage.sh
          VERSION=${{ github.ref_name }}
          VERSION=${VERSION#v}
          ./build-appimage.sh "$VERSION"
      
      - name: Build DEB
        run: cargo deb --no-build
      
      - name: Build RPM
        run: cargo generate-rpm
      
      - name: Prepare Arch binary
        run: |
          mkdir -p dist/arch
          cp target/release/offerings dist/arch/
          cd dist/arch && tar -czvf offerings-x86_64.tar.gz offerings
          mv offerings-x86_64.tar.gz ../
      
      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: offerings-packages
          path: |
            dist/*.AppImage
            target/debian/*.deb
            target/generate-rpm/*.rpm
            dist/offerings-x86_64.tar.gz
          retention-days: 7

  # Create GitHub Release
  release:
    runs-on: ubuntu-latest
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          name: offerings-packages
          path: ./artifacts/
      
      - name: Create checksums
        run: |
          cd artifacts
          find . -maxdepth 1 -type f -exec sha256sum {} + > SHA256SUMS.txt
          cat SHA256SUMS.txt
      
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, 'rc') || contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Publish to crates.io
  publish-crates:
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            pkg-config \
            libfontconfig1-dev \
            libfreetype6-dev \
            libexpat1-dev
      - name: Publish to crates.io
        run: cargo publish --allow-dirty --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
