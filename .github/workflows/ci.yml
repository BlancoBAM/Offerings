name: Build and Release

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: stable

jobs:
  build-and-package:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libssl-dev \
            pkg-config \
            libfontconfig1-dev \
            libfreetype6-dev \
            libexpat1-dev \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxcb-keysyms1-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            wayland-protocols \
            libegl1-mesa-dev \
            libgl1-mesa-dev \
            libgles2-mesa-dev \
            fuse \
            libfuse2 \
            curl \
            dpkg-dev \
            imagemagick

      - name: Install cargo-deb
        run: cargo install cargo-deb --locked

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build release binary
        run: cargo build --release

      - name: Build .deb package
        run: cargo deb --no-build

      - name: Build AppImage
        run: |
          chmod +x build-appimage.sh
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          [ -z "$VERSION" ] && VERSION="dev"
          APPIMAGE_EXTRACT_AND_RUN=1 ./build-appimage.sh "$VERSION"
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1

      - name: List artifacts
        run: |
          echo "=== DEB files ==="
          find target/debian/ -name "*.deb" 2>/dev/null || echo "No .deb found"
          echo "=== AppImage files ==="
          find dist/ -name "*.AppImage" 2>/dev/null || echo "No AppImage found"

      - name: Upload DEB artifact
        uses: actions/upload-artifact@v4
        with:
          name: offerings-deb
          path: target/debian/*.deb
          retention-days: 14
          if-no-files-found: warn

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: offerings-appimage
          path: dist/*.AppImage
          retention-days: 14
          if-no-files-found: warn

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/debian/*.deb
            dist/*.AppImage
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, 'rc') || contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') }}
          body: |
            ## Offerings ${{ github.ref_name }}

            ### Installation

            **AppImage** (works on any Linux, no install needed):
            ```bash
            chmod +x Offerings-*.AppImage
            ./Offerings-*.AppImage
            ```

            **Debian/Ubuntu .deb**:
            ```bash
            sudo dpkg -i offerings_*.deb
            ```

            **Install script** (recommended for Lilith Linux):
            ```bash
            curl -fsSL https://raw.githubusercontent.com/BlancoBAM/Offerings/main/install.sh | bash
            ```

            **From source**:
            ```bash
            cargo install --git https://github.com/BlancoBAM/Offerings
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
